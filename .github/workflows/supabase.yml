name: Supabase CI

on:
  push:
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Supabase checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v3
        with:
          version: 2.39.2

      - name: Start local Supabase and apply migrations
        run: |
          if [[ ! -f supabase/config.toml ]]; then
            supabase init
          fi
          supabase start
          supabase db reset --local --no-seed

      - name: Run database regression tests
        shell: bash
        env:
          PGOPTIONS: '-c plpgsql.check_asserts=on'
        run: |
          set -euo pipefail
          for suite in supabase/tests/*.sql; do
            echo "::group::$suite"
            psql -X --set=ON_ERROR_STOP=1 --dbname=postgresql://postgres:postgres@127.0.0.1:54322/postgres --file="$suite"
            echo "::endgroup::"
          done
